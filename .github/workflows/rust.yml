name: Evolution Contract CI

on:
  push:
    branches: [main, 'architecture/**']
  pull_request:
    branches: [main]

jobs:
  identity:
    name: identity gate
    runs-on: ubuntu-latest
    env:
      BASELINE_SHA: ffb45c06fd835f9b8cc765d91797090b9bfccc34
      BASELINE_LIB_BLOB: 68b0751d69e0d173b276407c9ed2339ad75a9c44
      BASELINE_CARGO_BLOB: dd9551ce6845019a3b4e6b06299937d36ba00dbc
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline commit and ancestry
        run: |
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" "$GITHUB_SHA"

      - name: Verify locked scaffold identity
        run: |
          test "$(git rev-parse "${BASELINE_SHA}:src/lib.rs")" = "$BASELINE_LIB_BLOB"
          test "$(git rev-parse "${BASELINE_SHA}:Cargo.toml")" = "$BASELINE_CARGO_BLOB"
          echo "IDENTITY: PASS"
          echo "BASELINE: $BASELINE_SHA"

  integrity:
    name: integrity gate
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check --all-targets
        run: cargo check --all-targets

  execution:
    name: execution + evidence gate
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: H2 regression tests
        run: |
          cargo test -- fitness::tests -- --nocapture | tee h2-test-output.txt
          grep -q 'test result: ok\. 6 passed; 0 failed' h2-test-output.txt
          echo 'EXECUTION: PASS'
          echo 'EVIDENCE: 6/6 passed'

  quality:
    name: quality advisory
    needs: execution
    if: ${{ always() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings
