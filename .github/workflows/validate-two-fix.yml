name: Validate and finalize evolution-contract fixes

on:
  push:
    branches: [validation/real-two-fix]

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exactly three justified fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/lib.rs")
          s = p.read_text()
          replacements = [
              (
                  "            pending.push(builder.build_child(parent, pid, request.mutation_rate, ordinal)?);",
                  "            let child = builder\n                .build_child(parent, pid, request.mutation_rate, ordinal)\n                .map_err(ApplyError::Build)?;\n            pending.push(child);",
                  "BuildError propagation",
              ),
              (
                  "                StructuralViolation::ConflictingRequest { pid: **pid },",
                  "                StructuralViolation::ConflictingRequest { pid: *pid },",
                  "conflicting-request PID dereference",
              ),
              (
                  "            branches: (0..12).map(|i| BranchRequest { parent: pid(2 + (i % 2) as u64), mutation_rate: 0.1 }).collect(),",
                  "            branches: (0..8).map(|i| BranchRequest { parent: pid(2 + (i % 2) as u64), mutation_rate: 0.1 }).collect(),",
                  "test fixture respects the max-offspring-per-parent cap while reaching builder failure ordinal 7",
              ),
          ]
          for old, new, label in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one target, found {s.count(old)}")
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Show exact patch
        run: git diff -- src/lib.rs

      - name: cargo fmt --check (baseline diagnostic)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-targets -- --nocapture

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Commit validated source and remove temporary harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f VALIDATION_TRIGGER.txt VALIDATION_TEST_OUTPUT.txt .github/workflows/validate-two-fix.yml
          git add src/lib.rs
          git add -u
          git commit -m "Fix compiler errors and align build-failure test fixture"
          git push
