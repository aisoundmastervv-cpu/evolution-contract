name: Cloud Execution Conformance v0.1

on:
  push:
    branches: ['cloud/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud-evidence
          printf '%s\n' \
            "commit=$GITHUB_SHA" \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "repository=$GITHUB_REPOSITORY" \
            "executor_spec=docs/gates/reference-executor-spec-v0.1.md" \
            "cloud_spec=docs/gates/cloud-execution-architecture-spec-v0.1.md" \
            | tee cloud-evidence/provenance.txt

      - name: Check cloud implementation formatting
        run: rustfmt --edition 2021 --check src/cloud_execution.rs src/cloud_executor_adapter.rs

      - name: Run cloud substrate conformance tests
        shell: bash
        run: |
          set -o pipefail
          rustc --edition 2021 --test src/cloud_executor_adapter.rs -o cloud-conformance-tests
          ./cloud-conformance-tests --nocapture 2>&1 | tee cloud-evidence/raw-test-output.txt

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "job_status=${{ job.status }}"
          } | tee cloud-evidence/result.txt

      - name: Upload cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-conformance-v0-1-evidence-${{ github.sha }}
          path: cloud-evidence/
          if-no-files-found: error
