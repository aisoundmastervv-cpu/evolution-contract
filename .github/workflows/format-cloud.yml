name: Format Cloud Implementation

on:
  push:
    branches: ['cloud/**']

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format cloud implementation
        run: rustfmt --edition 2021 src/cloud_execution.rs
      - name: Commit formatting only
        run: |
          if git diff --quiet -- src/cloud_execution.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cloud_execution.rs
          git commit -m 'Format cloud implementation'
          git push
