name: G11 Harness

on:
  push:
    branches:
      - validation/real-two-fix
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT_REF: docs/spec/evolution-application-contract-v1.0.md
  G11_BASELINE_REF: docs/G11.1-semantic-baseline.md
  TEST_PLAN_REF: docs/G11-test-plan.md

jobs:
  g11-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g11-evidence
          printf '{"commit":"%s","contract":"%s","g11_baseline":"%s","test_plan":"%s"}\n' \
            "$GITHUB_SHA" "$CONTRACT_REF" "$G11_BASELINE_REF" "$TEST_PLAN_REF" \
            | tee g11-evidence/provenance.json
          git status --short --branch | tee g11-evidence/git-status.txt

      - name: Run G11 harness
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib g11_harness -- --nocapture 2>&1 | tee g11-evidence/g11-raw.txt
          TEST_STATUS=${PIPESTATUS[0]}
          echo "G11_TEST_STATUS=$TEST_STATUS" >> "$GITHUB_ENV"
          exit "$TEST_STATUS"

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "job=$GITHUB_JOB"
            echo "test_status=${G11_TEST_STATUS:-unknown}"
          } | tee g11-evidence/result.txt

      - name: Upload raw G11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g11-raw-evidence-${{ github.sha }}
          path: g11-evidence/
          if-no-files-found: error
