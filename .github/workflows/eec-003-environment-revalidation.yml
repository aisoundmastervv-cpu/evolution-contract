# EEC-003 execution candidate: push-triggered run on the exact candidate branch.
name: EEC-003 Environment Revalidation

on:
  push:
    branches:
      - cloud/eec-003-environment-revalidation
      - cloud/eec-003-execution-candidate
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/agent-environment-gate.sh'
      - 'scripts/agent-mutation-entrypoint.sh'
      - 'scripts/environment-preflight.sh'
      - 'scripts/bootstrap-environment.sh'
      - 'docs/execution/environment-contract-v0.1.md'
      - 'docs/execution/eec-003-environment-revalidation-v0.1.md'
      - '.github/workflows/eec-003-environment-revalidation.yml'

permissions:
  contents: read

env:
  EEC_EVIDENCE: ${{ runner.temp }}/eec-003-evidence.txt

jobs:
  eec-003:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Establish initial READY and record clean canonical state
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_COMMIT"
          remote="$(git remote get-url origin)"
          contract_sha="$(sha256sum docs/execution/environment-contract-v0.1.md | awk '{print $1}')"
          bootstrap_sha="$(sha256sum scripts/bootstrap-environment.sh | awk '{print $1}')"
          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"
          identity_input=$(printf '%s\n' \
            "repository=$remote" \
            "commit=$actual" \
            "environment_contract_sha256=$contract_sha" \
            "bootstrap_sha256=$bootstrap_sha" \
            "rustc=$rustc_version" \
            "cargo=$cargo_version")
          environment_id="$(printf '%s' "$identity_input" | sha256sum | awk '{print $1}')"
          test -z "$(git status --porcelain)"
          {
            printf 'expected_commit=%s\n' "$EXPECTED_COMMIT"
            printf 'initial_remote=%s\n' "$remote"
            printf 'initial_head=%s\n' "$actual"
            printf 'initial_workspace_status='; git status --porcelain
            printf 'initial_environment_id=%s\n' "$environment_id"
            printf 'initial_rustc=%s\n' "$rustc_version"
            printf 'initial_cargo=%s\n' "$cargo_version"
          } | tee "$EEC_EVIDENCE"
          EXPECTED_COMMIT="$EXPECTED_COMMIT" EXPECTED_ENVIRONMENT_ID="$environment_id" bash scripts/agent-environment-gate.sh | tee -a "$EEC_EVIDENCE"
          grep -Fq 'AGENT_ENVIRONMENT: READY' "$EEC_EVIDENCE"
          echo 'EEC-003: initial READY established' | tee -a "$EEC_EVIDENCE"
          printf 'EXPECTED_ENVIRONMENT_ID=%s\n' "$environment_id" >> "$GITHUB_ENV"

      - name: Controlled environment-only drift and mutation re-entry
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          drift_dir="$RUNNER_TEMP/eec-003-drift-bin"
          sentinel="$RUNNER_TEMP/eec-003-mutation-sentinel"
          stderr="$RUNNER_TEMP/eec-003-reentry-stderr.txt"
          mkdir -p "$drift_dir"
          real_rustc="$(command -v rustc)"
          cat > "$drift_dir/rustc" <<EOF
#!/usr/bin/env bash
if [[ "\${1:-}" == "--version" ]]; then
  echo 'rustc 999.0.0 (controlled-environment-drift)'
  exit 0
fi
exec "$real_rustc" "\$@"
EOF
          chmod +x "$drift_dir/rustc"
          export PATH="$drift_dir:$PATH"
          drifted_rustc="$(rustc --version)"
          test "$drifted_rustc" = 'rustc 999.0.0 (controlled-environment-drift)'
          remote="$(git remote get-url origin)"
          head="$(git rev-parse HEAD)"
          workspace_status="$(git status --porcelain)"
          test "$head" = "$EXPECTED_COMMIT"
          test -z "$workspace_status"
          {
            printf 'drift_rustc=%s\n' "$drifted_rustc"
            printf 'drift_remote=%s\n' "$remote"
            printf 'drift_head=%s\n' "$head"
            printf 'drift_workspace_status=%s\n' "$workspace_status"
          } | tee -a "$EEC_EVIDENCE"
          rm -f "$sentinel" "$stderr"
          set +e
          EXPECTED_ENVIRONMENT_ID="$EXPECTED_ENVIRONMENT_ID" bash scripts/agent-mutation-entrypoint.sh "$EXPECTED_COMMIT" -- touch "$sentinel" 2>"$stderr" >>"$EEC_EVIDENCE"
          reentry_exit=$?
          set -e
          cat "$stderr" | tee -a "$EEC_EVIDENCE"
          printf 'reentry_exit=%s\n' "$reentry_exit" | tee -a "$EEC_EVIDENCE"
          test "$reentry_exit" -ne 0
          grep -Fq 'AGENT_ENVIRONMENT: NOT_READY' "$stderr"
          grep -Fq 'reason=environment-identity-mismatch' "$stderr"
          test ! -e "$sentinel"
          echo 'mutation_sentinel=absent' | tee -a "$EEC_EVIDENCE"
          echo 'EEC-003: PASS — environment drift revoked mutation authorization' | tee -a "$EEC_EVIDENCE"

      - name: Final invariant record
        if: always()
        run: |
          set -euo pipefail
          {
            printf 'final_remote=%s\n' "$(git remote get-url origin)"
            printf 'final_head=%s\n' "$(git rev-parse HEAD)"
            printf 'final_workspace_status=%s\n' "$(git status --porcelain)"
            if [[ -e "$RUNNER_TEMP/eec-003-mutation-sentinel" ]]; then echo 'final_mutation_sentinel=present'; else echo 'final_mutation_sentinel=absent'; fi
          } | tee -a "$EEC_EVIDENCE"

      - name: Upload raw EEC-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eec-003-environment-revalidation-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/eec-003-evidence.txt
          if-no-files-found: error
