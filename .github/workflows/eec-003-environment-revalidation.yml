# EEC-003 execution is chained from successful EEC-001 on the default branch.
name: EEC-003 Environment Revalidation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eec-003-environment-revalidation:
    name: EEC-003 environment revalidation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Experimental harness delegated to EEC-003 execution workflow
        run: |
          set -euo pipefail
          echo 'EEC-003 execution workflow is registered on main.'
